<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - Psychological Support Analysis / 心理辅助治疗分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --secondary-color: #64748b;
            --accent-color: #0891b2;
            --accent-light: #38bdf8;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --background-color: #f8fafc;
            --background-secondary: #f1f5f9;
            --card-background: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --border-radius: 16px;
            --border-radius-sm: 8px;
            --border-radius-lg: 24px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.15s ease;
            --transition-slow: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #10b981 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.05)" d="M0,192L48,181.3C96,171,192,149,288,138.7C384,128,480,128,576,149.3C672,171,768,213,864,208C960,203,1056,149,1152,144C1248,139,1344,181,1392,202.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            z-index: 0;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 3rem 0;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: float 25s linear infinite;
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(-30px, -30px) rotate(360deg);
            }
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }
        
        .header p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }
        
        .main-container {
            margin-top: 3rem;
            margin-bottom: 3rem;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: var(--transition-slow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 6s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px) scale(1.02);
        }
        
        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }
        
        .card-header {
            background: var(--card-background);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-header h5 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .card-header h5 i {
            color: var(--primary-color);
            font-size: 1.125rem;
        }
        
        .card-body {
            padding: 1.5rem;
        }
        
        .btn {
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border: none;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }
        
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: var(--shadow-md);
        }
        
        .btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }
        
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color) 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
        }
        
        .btn-danger:hover {
            box-shadow: 0 4px 8px rgba(239, 68, 68, 0.4);
        }
        
        .btn-secondary {
            background: var(--background-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            border-color: var(--primary-light);
            color: var(--primary-color);
            background: var(--primary-bg);
        }
        
        .table {
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .table th {
            background-color: var(--background-secondary);
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-light);
            padding: 1rem;
        }
        
        .table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
        
        .table-hover tbody tr:hover {
            background-color: var(--background-secondary);
            transition: var(--transition-fast);
        }
        
        .patient-card {
            margin-bottom: 1.5rem;
            border-radius: var(--border-radius);
            overflow: hidden;
        }
        
        .patient-card .card-header {
            background: linear-gradient(135deg, var(--primary-bg) 0%, #f0f9ff 100%);
            border-bottom: 1px solid var(--border-light);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .session-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition-fast);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .session-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }
        
        .session-item:hover::before {
            transform: scaleY(1);
        }
        
        .session-item:last-child {
            border-bottom: none;
        }
        
        .session-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(8px) scale(1.01);
            box-shadow: var(--shadow-sm);
        }
        
        .session-info {
            flex: 1;
        }
        
        .session-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-state h4 {
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        .empty-state p {
            margin-bottom: 0;
        }
        
        /* 模态框 */
        .modal-content {
            border-radius: var(--border-radius-lg);
            border: none;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }
        
        .modal-header {
            background: var(--card-background);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
        }
        
        .modal-title {
            font-weight: 600;
            font-size: 1.125rem;
            color: var(--text-primary);
        }
        
        .modal-body {
            padding: 1.5rem;
        }
        
        .modal-footer {
            background: var(--background-secondary);
            border-top: 1px solid var(--border-light);
            padding: 1rem 1.5rem;
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(79, 70, 229, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .header {
                padding: 2rem 0;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .main-container {
                margin-top: 2rem;
                margin-bottom: 2rem;
            }
            
            .card-header,
            .card-body {
                padding: 1rem;
            }
            
            .session-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            
            .session-actions {
                align-self: flex-end;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <header class="header text-center">
        <div class="container header-content">
            <h1>Admin Console / 后台管理</h1>
            <p class="lead">Manage patient data and session records.</p>
            <a href="/static/index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to System
            </a>
        </div>
    </header>

    <div class="container main-container">
        <div class="row">
            <div class="col-md-12">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-users"></i> Patient Management</h5>
                        <div class="d-flex gap-2">
                            <button id="delete-all-btn" class="btn btn-danger">
                                <i class="fas fa-trash-alt"></i> Delete All
                            </button>
                            <button id="refresh-btn" class="btn btn-primary">
                                <i class="fas fa-sync-alt"></i> Refresh Data
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="patients-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">
                        <i class="fas fa-exclamation-triangle"></i> Confirm Deletion
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="delete-message">Are you sure you want to delete the selected patient data?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirm-delete-btn" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let patients = [];
        let selectedPatientId = null;
        
        // 页面加载时检查登录状态
        window.onload = function() {
            checkLoginStatus();
        };
        
        // 检查登录状态
        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (!token) {
                // 未登录，跳转到登录页面
                window.location.href = '/static/login.html';
                return;
            }
            
            try {
                // 验证token是否有效
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    // token无效，跳转到登录页面
                    localStorage.removeItem('token');
                    localStorage.removeItem('token_type');
                    window.location.href = '/static/login.html';
                    return;
                }
                
                // 登录成功，加载患者数据
                loadPatients();
                
                // 绑定刷新按钮点击事件
                document.getElementById('refresh-btn').addEventListener('click', loadPatients);
                
                // 绑定全部删除按钮点击事件
                document.getElementById('delete-all-btn').addEventListener('click', function() {
                    if (confirm('Delete all patient data? This action cannot be undone.')) {
                        deleteAllPatients();
                    }
                });
                
                // 绑定确认删除按钮点击事件
                document.getElementById('confirm-delete-btn').addEventListener('click', function() {
                    if (selectedPatientId) {
                        deletePatient(selectedPatientId);
                    }
                });
            } catch (error) {
                // 网络错误，跳转到登录页面
                localStorage.removeItem('token');
                localStorage.removeItem('token_type');
                window.location.href = '/static/login.html';
            }
        };
        
        // 加载患者数据
        async function loadPatients() {
            try {
                const patientsContainer = document.getElementById('patients-container');
                patientsContainer.innerHTML = `
                    <div class="text-center py-5">
                        <div class="loading"></div>
                        <p class="mt-3">Loading...</p>
                    </div>
                `;
                
                const token = localStorage.getItem('token');
                const response = await fetch('/api/patients', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) {
                    patients = await response.json();
                    renderPatients();
                } else {
                    console.error('Failed to load patients');
                    renderEmptyState('Failed to load data. Please try again later.');
                }
            } catch (error) {
                console.error('Error loading patients:', error);
                renderEmptyState('Network error. Please check your connection.');
            }
        }
        
        // 渲染空状态
        function renderEmptyState(message) {
            const patientsContainer = document.getElementById('patients-container');
            patientsContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-folder-open"></i>
                    <h4>No Data Yet</h4>
                    <p>${message}</p>
                </div>
            `;
        }
        
        // 渲染患者列表
        function renderPatients() {
            const patientsContainer = document.getElementById('patients-container');
            patientsContainer.innerHTML = '';
            
            if (patients.length === 0) {
                renderEmptyState('No patient data available.');
                return;
            }
            
            patients.forEach(patient => {
                const patientCard = document.createElement('div');
                patientCard.className = 'patient-card card';
                patientCard.innerHTML = `
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6><i class="fas fa-user"></i> Patient ID: ${patient.patient_id}</h6>
                            <div>
                                <button class="btn btn-sm btn-danger delete-patient-btn" data-patient-id="${patient.patient_id}">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <h6 class="mb-3"><i class="fas fa-history"></i> Session Records</h6>
                        <div class="sessions-list">
                            ${patient.sessions.map(session => `
                                <div class="session-item">
                                    <div class="session-info">
                                        <strong>Session ID:</strong> ${session.session_id}<br>
                                        <strong>Start Time:</strong> ${new Date(session.start_time).toLocaleString()}<br>
                                        <strong>End Time:</strong> ${session.end_time ? new Date(session.end_time).toLocaleString() : 'Not finished'}
                                    </div>
                                    <div class="session-actions">
                                        <button class="btn btn-sm btn-primary view-session-btn" data-session-id="${session.session_id}">
                                            <i class="fas fa-eye"></i> View Details
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                patientsContainer.appendChild(patientCard);
            });
            
            // 绑定删除按钮点击事件
            document.querySelectorAll('.delete-patient-btn').forEach(button => {
                button.addEventListener('click', function() {
                    selectedPatientId = this.getAttribute('data-patient-id');
                    document.getElementById('delete-message').textContent = `Delete all data for patient ${selectedPatientId}?`;
                    const modal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
                    modal.show();
                });
            });
            
            // 绑定查看详情按钮点击事件
            document.querySelectorAll('.view-session-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const sessionId = this.getAttribute('data-session-id');
                    window.location.href = `/static/index.html?session_id=${sessionId}`;
                });
            });
        }
        
        // 删除患者数据
        async function deletePatient(patientId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/patients/${patientId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) {
                    // 关闭模态框
                    const modal = bootstrap.Modal.getInstance(document.getElementById('confirmDeleteModal'));
                    modal.hide();
                    
                    // 重新加载患者数据
                    loadPatients();
                    
                    // 显示成功消息
                    alert('Patient data deleted.');
                } else {
                    console.error('Failed to delete patient');
                    alert('Delete failed.');
                }
            } catch (error) {
                console.error('Error deleting patient:', error);
                alert('Delete failed.');
            }
        }
        
        // 删除所有患者数据
        async function deleteAllPatients() {
            try {
                const patientsContainer = document.getElementById('patients-container');
                patientsContainer.innerHTML = `
                    <div class="text-center py-5">
                        <div class="loading"></div>
                        <p class="mt-3">Deleting...</p>
                    </div>
                `;
                
                const token = localStorage.getItem('token');
                const response = await fetch('/api/patients', {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) {
                    // 重新加载患者数据
                    loadPatients();
                    
                    // 显示成功消息
                    alert('All patient data deleted.');
                } else {
                    console.error('Failed to delete all patients');
                    alert('Delete failed.');
                    loadPatients();
                }
            } catch (error) {
                console.error('Error deleting all patients:', error);
                alert('Delete failed.');
                loadPatients();
            }
        }
    </script>
</body>
</html>
